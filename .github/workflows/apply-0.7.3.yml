name: Apply 0.7.3 release

on:
  push:
    branches:
      - release/0.7.3-rummy-joker-clockwise

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact release patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-staging/0.7.3.patch.xz.b64 | xz -d > /tmp/release-0.7.3.patch
          git apply --check /tmp/release-0.7.3.patch
          git apply /tmp/release-0.7.3.patch
          rm -rf .release-staging
          rm -f .github/workflows/apply-0.7.3.yml
      - name: Test release
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check engine-core.js
          node --check battle-engine.js
          node --check games/sevens.js
          node --check games/war.js
          node --check games/rummy.js
          node tests/test-engine.js
          node tests/test-battle-engine.js
          node tests/test-game-definition.js
          node tests/test-app-contract.js
      - name: Commit final release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Card Sandbox 0.7.3 Rummy scoring, clockwise & Joker solver'
          git push origin HEAD:release/0.7.3-rummy-joker-clockwise
