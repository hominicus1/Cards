name: Apply Card Sandbox 0.7.2

on:
  push:
    branches:
      - release/0.7.2-rummy-rounds-500
    paths:
      - '.github/workflows/apply-0.7.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.2-rummy-rounds-500
          fetch-depth: 0

      - name: Rebuild release patch
        shell: bash
        run: |
          cat staging/0.7.2.part00.b64 staging/0.7.2.part01.b64 | base64 -d | xz -d > /tmp/card-sandbox-0.7.2.patch
          git apply --check -p1 /tmp/card-sandbox-0.7.2.patch
          git apply -p1 /tmp/card-sandbox-0.7.2.patch
          rm -rf staging
          rm -f .github/workflows/apply-0.7.2.yml

      - name: Verify JavaScript and regression tests
        shell: bash
        run: |
          node --check app.js
          node --check engine-core.js
          node --check battle-engine.js
          node --check games/sevens.js
          node --check games/war.js
          node --check games/rummy.js
          node tests/test-engine.js
          node tests/test-battle-engine.js
          node tests/test-game-definition.js
          node tests/test-app-contract.js

      - name: Commit final release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Card Sandbox 0.7.2 Remik rounds to 500'
          git push origin HEAD:release/0.7.2-rummy-rounds-500
