name: Apply Card Sandbox 0.6.0

on:
  push:
    branches:
      - 'release/0.6.0-battle-engine'
    paths:
      - 'staging/0.6.0.zip'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested 0.6.0 build
        shell: bash
        run: |
          unzip -o staging/0.6.0.zip -d .
          rm staging/0.6.0.zip

      - name: Verify JavaScript and tests
        shell: bash
        run: |
          node --check app.js
          node --check engine-core.js
          node --check battle-engine.js
          node --check games/sevens.js
          node --check games/war.js
          node tests/test-engine.js
          node tests/test-battle-engine.js
          node tests/test-game-definition.js
          node tests/test-app-contract.js

      - name: Commit tested build
        shell: bash
        run: |
          git config user.name "Card Sandbox Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- README.md app.js battle-engine.js engine-core.js games/sevens.js games/war.js index.html style.css tests/test-app-contract.js tests/test-battle-engine.js tests/test-engine.js tests/test-game-definition.js staging/0.6.0.zip
          git commit -m "release: Card Sandbox 0.6.0 battle engine, War and Auto Play"
          git push origin "HEAD:${GITHUB_REF_NAME}"
