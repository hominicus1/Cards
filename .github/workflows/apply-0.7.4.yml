name: Apply 0.7.4 release

on:
  push:
    branches:
      - release/0.7.4-empty-discard-start
    paths:
      - 'staging/0.7.4.patch.xz.b64'
      - '.github/workflows/apply-0.7.4.yml'

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.4-empty-discard-start
          fetch-depth: 0
      - name: Apply exact release patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d staging/0.7.4.patch.xz.b64 | xz -d > /tmp/0.7.4.patch
          git apply --check -p1 /tmp/0.7.4.patch
          git apply -p1 /tmp/0.7.4.patch
          rm -f staging/0.7.4.patch.xz.b64 .github/workflows/apply-0.7.4.yml
          rmdir staging 2>/dev/null || true
      - name: Test release
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check engine-core.js
          node --check battle-engine.js
          node --check games/sevens.js
          node --check games/war.js
          node --check games/rummy.js
          node tests/test-engine.js
          node tests/test-battle-engine.js
          node tests/test-game-definition.js
          node tests/test-app-contract.js
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Card Sandbox 0.7.4 Empty Discard Start'
          git push origin HEAD:release/0.7.4-empty-discard-start
