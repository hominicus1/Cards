name: Build Card Sandbox 0.7.0

on:
  push:
    branches:
      - release/0.7.0-remik-51
    paths:
      - .github/workflows/release-070-builder.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-remik-51
          fetch-depth: 0

      - name: Apply exact 0.7.0 release and test
        shell: bash
        run: |
          set -euo pipefail
          cat .release-0.7.0.part* | base64 -d | xz -d > /tmp/release-0.7.0.patch
          git apply --index /tmp/release-0.7.0.patch

          rm -f .release-0.7.0.part00 .release-0.7.0.part01 .release-0.7.0.part02 .release-0.7.0.part03 .release-0.7.0.part04 .release-0.7.0.part05
          rm -f .github/workflows/release-070-builder.yml
          git add -A

          node --check app.js
          node --check engine-core.js
          node --check games/rummy.js
          node tests/test-engine.js
          node tests/test-battle-engine.js
          node tests/test-game-definition.js
          node tests/test-app-contract.js

          grep -q "BUILD_VERSION='0.7.0'" app.js
          grep -q 'games/rummy.js?v=0.7.0' index.html

          git config user.name 'hominicus1'
          git config user.email 'hominicus@gmail.com'
          git commit -m 'release: Card Sandbox 0.7.0 Remik 51'
          git push origin HEAD:release/0.7.0-remik-51
